# .github/workflows/build-lk.yml

name: Build Patched & Signed LK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_mode:
        description: 'Signing mode'
        required: true
        default: 'test'
        type: choice
        options: [test, release]

jobs:
  build:
    name: Patch → Sign → Upload
    runs-on: ubuntu-22.04

    env:
      LK_IN:      lk.bin
      LK_PATCHED: out/lk_patched.bin
      LK_SIGNED:  out/lk_signed.bin
      KEY_PRIV:   keys/lk_rsa2048.pem
      KEY_PUB:    keys/lk_rsa2048_pub.pem
      SIGN_MODE:  ${{ github.event.inputs.sign_mode || 'test' }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── no external deps — stdlib only ─────────────────────
      - name: Validate lk.bin
        run: |
          python3 scripts/validate_lk.py lk.bin
          echo "LK_SHA256=$(sha256sum lk.bin | cut -d' ' -f1)" >> $GITHUB_ENV

      # ── auto-find patch offsets (replaces Ghidra) ──────────
      - name: Find patch offsets
        run: |
          mkdir -p out
          python3 scripts/find_offsets.py \
            --input lk.bin \
            --out   out/offsets.json

      # ── apply patches ──────────────────────────────────────
      - name: Patch lk.bin
        run: |
          python3 scripts/patch_lk.py \
            --input   lk.bin           \
            --output  ${{ env.LK_PATCHED }} \
            --offsets out/offsets.json

      # ── test key (ephemeral, CI only) ──────────────────────
      - name: Generate test key
        if: env.SIGN_MODE == 'test'
        run: |
          mkdir -p keys
          openssl genrsa -out ${{ env.KEY_PRIV }} 2048
          openssl rsa    -in  ${{ env.KEY_PRIV }} \
                         -pubout -out ${{ env.KEY_PUB }}
          openssl req -new -x509 \
            -key  ${{ env.KEY_PRIV }} \
            -out  keys/cert.der      \
            -days 3650               \
            -subj '/CN=LK-TEST/O=CI/C=US' \
            -outform DER

      # ── release key from secrets ───────────────────────────
      - name: Restore release key
        if: env.SIGN_MODE == 'release'
        env:
          LK_SIGNING_KEY:  ${{ secrets.LK_SIGNING_KEY }}
          LK_SIGNING_CERT: ${{ secrets.LK_SIGNING_CERT }}
        run: |
          mkdir -p keys
          echo "$LK_SIGNING_KEY"  | base64 -d > ${{ env.KEY_PRIV }}
          echo "$LK_SIGNING_CERT" | base64 -d > keys/cert.der
          openssl rsa -in ${{ env.KEY_PRIV }} \
                      -pubout -out ${{ env.KEY_PUB }}
          chmod 600 ${{ env.KEY_PRIV }}

      # ── sign ───────────────────────────────────────────────
      - name: Sign
        run: |
          python
